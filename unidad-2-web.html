<meta name="claude:viewport-fit-sides" content="cover">
<title>Matemáticas 4.º · Unidad 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a clean, neutral interface (white surfaces, navy text, fine borders) with colour used on
   purpose: the brand blue for actions, and one accent per activity. Type: Plus Jakarta Sans. */
:root{
  --fs:18px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#f5f6f9;--surface:#ffffff;--surface-2:#f8f9fc;--paper:#f8f9fc;
  --ink:#17213b;--ink-2:#3a4663;--muted:#667190;
  --line:#e4e8f0;--line-strong:#c8cfdd;
  --brand:#2b5fd9;--brand-deep:#2049b0;--brand-tint:#eaf0fd;
  --top:#17213b;--top-ink:#ffffff;
  --ok:#137a58;--ok-tint:#e7f5ef;
  --bad:#c23b25;--bad-tint:#fdeeea;
  --warn:#8a5a00;--warn-tint:#fbf3df;
  --yellow:#e8a600;--yellow-tint:#fbf3df;--yellow-deep:#b07d00;
  --coral:#e5573c;--coral-tint:#fdeeea;
  --mint:#17a07a;--mint-deep:#137a58;--mint-tint:#e7f5ef;
  --violet:#6a4fd8;--violet-tint:#eeeafc;
  --pink:#d6457f;--pink-tint:#fbe9f1;
  --sky:#eaf0fd;
  --s1:#2b5fd9;--s2:#e5573c;
  --g0:#b23a26;--g0t:#fdeeea;--g1:#8a5a00;--g1t:#fbf3df;--g2:#137a58;--g2t:#e7f5ef;--g3:#2049b0;--g3t:#eaf0fd;--g4:#5b3fd6;--g4t:#eeeafc;
  --radius:16px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(23,33,59,.05),0 6px 18px rgba(23,33,59,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1426;--surface:#141d33;--surface-2:#1a2540;--paper:#1a2540;
    --ink:#e9edf8;--ink-2:#c3cbe0;--muted:#97a2bf;
    --line:#27324f;--line-strong:#3b4a6e;
    --brand:#7ea4ff;--brand-deep:#5b87f0;--brand-tint:#1c2c52;
    --top:#0a1020;--top-ink:#ffffff;
    --ok:#5fd6a8;--ok-tint:#143a2e;--bad:#ff8a73;--bad-tint:#3d2420;--warn:#ffd466;--warn-tint:#352c12;
    --yellow:#ffc32e;--yellow-tint:#352c12;--yellow-deep:#ffd45c;
    --coral:#ff8a73;--coral-tint:#3d2420;
    --mint:#3fcf9f;--mint-deep:#7fe6c2;--mint-tint:#143a2e;
    --violet:#a894ff;--violet-tint:#272150;
    --pink:#ff8cc4;--pink-tint:#3a2030;
    --sky:#1c2c52;--s1:#7ea4ff;--s2:#ff8a73;
    --g0:#ff9a84;--g0t:#3d2420;--g1:#ffd466;--g1t:#352c12;--g2:#7fe6c2;--g2t:#143a2e;--g3:#9fbcff;--g3t:#1c2c52;--g4:#c4b5ff;--g4t:#272150;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1426;--surface:#141d33;--surface-2:#1a2540;--paper:#1a2540;
  --ink:#e9edf8;--ink-2:#c3cbe0;--muted:#97a2bf;
  --line:#27324f;--line-strong:#3b4a6e;
  --brand:#7ea4ff;--brand-deep:#5b87f0;--brand-tint:#1c2c52;
  --top:#0a1020;--top-ink:#ffffff;
  --ok:#5fd6a8;--ok-tint:#143a2e;--bad:#ff8a73;--bad-tint:#3d2420;--warn:#ffd466;--warn-tint:#352c12;
  --yellow:#ffc32e;--yellow-tint:#352c12;--yellow-deep:#ffd45c;
  --coral:#ff8a73;--coral-tint:#3d2420;
  --mint:#3fcf9f;--mint-deep:#7fe6c2;--mint-tint:#143a2e;
  --violet:#a894ff;--violet-tint:#272150;
  --pink:#ff8cc4;--pink-tint:#3a2030;
  --sky:#1c2c52;--s1:#7ea4ff;--s2:#ff8a73;
  --g0:#ff9a84;--g0t:#3d2420;--g1:#ffd466;--g1t:#352c12;--g2:#7fe6c2;--g2t:#143a2e;--g3:#9fbcff;--g3t:#1c2c52;--g4:#c4b5ff;--g4t:#272150;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
h1,h2,h3{font-family:var(--font);font-weight:700;line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:default}

.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.ic.fill{fill:currentColor}
.scene{display:block;width:100%;height:auto}
.deco{display:none}

/* Shell */
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--top);color:var(--top-ink)}
.top .wrap{display:flex;align-items:center;gap:1rem;min-height:60px;padding-block:.5rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.65rem;background:none;border:0;color:inherit;padding:0;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.logo svg{width:2rem;height:2rem;flex:none;border-radius:9px}
.top-school{font-weight:500;color:#c9d3ec;font-size:.92rem}
.sizes{display:flex;gap:.35rem;margin-left:auto}
.top-btn{min-height:40px;min-width:44px;padding:.2rem .7rem;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;font-weight:600;font-size:.95rem}
.top-btn:hover{background:rgba(255,255,255,.1)}
.page{padding-block:1.4rem 2.6rem;flex:1}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;padding-block:1.1rem;background:var(--surface)}
.foot b{color:var(--ink-2);font-weight:600}

/* Shared */
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ink2{color:var(--ink-2)}
.muted{color:var(--muted)}
.bubble{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .85rem;font-weight:600;font-size:.95rem;color:var(--ink-2)}
.bubble .fill{color:var(--yellow)}
.bubble .ic{color:var(--ok)}

/* Home hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:1.6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(1.4rem,4vw,2.6rem);margin-top:.2rem;overflow:hidden}
.hero h1{font-size:clamp(2rem,4.6vw,3rem);line-height:1.08;letter-spacing:-.025em;color:var(--ink);margin:.6rem 0 .9rem}
.hero p.lead{font-size:1.1rem;color:var(--ink-2);max-width:40ch}
.hero-art{position:relative;z-index:1;background:var(--sky);border-radius:12px;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:.4rem;color:var(--brand);font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:0}
.hero-stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.hero-meta{margin-top:1.2rem;font-weight:600;color:var(--ink);font-size:.98rem}
@media (max-width:760px){ .hero{grid-template-columns:1fr} .hero-art{max-width:460px} }

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:2.2rem 0 1rem;flex-wrap:wrap;padding-bottom:.7rem;border-bottom:1px solid var(--line)}
.sec-h h2{font-size:1.4rem;color:var(--ink)}
.sec-h .muted{font-size:.95rem}

/* Activity cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:1rem}
.card-act{display:flex;flex-direction:column;overflow:hidden;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--radius);padding:0;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.card-act:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.card-act:active{transform:translateY(1px)}
.card-act .art{background:color-mix(in srgb,var(--c) 10%,var(--surface));padding:.7rem .7rem 0}
.card-act .art .scene{border-radius:10px 10px 0 0}
.card-act .body{padding:1rem 1.15rem 1.15rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.badge{display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.card-t{font-weight:700;font-size:1.12rem;line-height:1.25;color:var(--ink);margin-top:.1rem}
.card-d{color:var(--ink-2);font-size:.95rem;line-height:1.45}
.card-f{margin-top:auto;padding-top:.8rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-weight:600;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line);margin-top:.7rem}

/* Stars (only the flag icon is still used in the old list; kept hidden) */
.stars{display:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:50px;padding:.55rem 1.15rem;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:1rem;box-shadow:0 1px 1px rgba(23,33,59,.04)}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.btn:disabled{opacity:.45}
.actions{display:flex;justify-content:space-between;gap:.7rem;flex-wrap:wrap;margin-top:1.4rem;align-items:center}
.actions.center{justify-content:center}
.crumb{margin-bottom:1rem}
.crumb .btn{min-height:42px;padding:.3rem .9rem;font-size:.95rem;border-color:transparent;background:transparent;color:var(--ink-2)}
.crumb .btn:hover:not(:disabled){background:var(--surface-2);color:var(--brand);border-color:var(--line)}

/* Activity banner (quiz header with illustration) */
.quiz{--c:#2b5fd9;--tint:#eaf0fd;--on:#fff}
.banner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.75fr);gap:1.2rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--radius);padding:1.2rem 1.4rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.banner h2{font-size:clamp(1.6rem,3.6vw,2.2rem);line-height:1.15;margin:.3rem 0 .4rem;color:var(--ink);letter-spacing:-.02em}
.banner p.desc{color:var(--ink-2);font-size:1rem}
.banner-art{border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
@media (max-width:620px){ .banner{grid-template-columns:1fr} .banner-art{order:-1;max-width:260px} }

/* Progress */
.segs{display:grid;grid-template-columns:repeat(var(--n,9),minmax(0,1fr));gap:4px;margin:0 0 1rem}
.segs i{height:6px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--c)}
.segs i.cur{background:color-mix(in srgb,var(--c) 45%,var(--line))}

/* Sheet and question */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(1.2rem,3vw,2rem);box-shadow:var(--shadow)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.pill-s{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:8px;padding:.25rem .7rem;font-weight:600;font-size:.9rem}
.pill-s .fill{color:var(--yellow)}
.q{font-weight:600;font-size:clamp(1.3rem,3.2vw,1.75rem);line-height:1.35;margin:0 0 1.2rem;color:var(--ink);text-wrap:pretty;letter-spacing:-.01em}
.q b{font-weight:700;color:var(--brand);background:none;padding:0}
.q i{font-style:normal;color:var(--muted);font-size:.8em}

/* Choices */
.opts{display:grid;gap:.5rem}
.opt{display:flex;align-items:center;gap:.85rem;width:100%;min-height:60px;padding:.55rem .9rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--ink);font-weight:600;font-size:1.08rem;text-align:left;transition:border-color .12s ease,background .12s ease}
.opt:not(:disabled):hover{border-color:var(--brand);background:var(--brand-tint)}
.opt:disabled{cursor:default}
.opt .letter{width:2.1rem;height:2.1rem;flex:none;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.opt.right{background:var(--ok-tint);border-color:var(--ok)}
.opt.right .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad);color:var(--bad)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled:not(.right):not(.wrong){opacity:.5}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* Answer line and keypad */
.answer{display:flex;align-items:flex-end;justify-content:center;gap:.6rem;min-height:5rem;max-width:460px;margin:.2rem auto 1.1rem;border-bottom:2px solid var(--line-strong);padding-bottom:.2rem;font-weight:700;font-size:clamp(2.4rem,8vw,3rem);line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.answer .unit{font-size:1.3rem;color:var(--muted);font-weight:600;padding-bottom:.4rem}
.answer .ph{color:var(--line-strong)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:460px;margin:0 auto}
.key{min-height:62px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.key:hover:not(:disabled){border-color:var(--brand)}
.key:not(:disabled):active{background:var(--surface-2)}
.key.fn{background:var(--surface-2);color:var(--ink-2);font-size:1.15rem}
.key.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.key:disabled{opacity:.45}

/* Feedback */
.fb{--fc:var(--ok);display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start;margin-top:1.2rem;padding:.9rem 1rem;border-radius:var(--radius-sm);border-left:4px solid var(--fc);background:var(--ok-tint);font-size:1.02rem;line-height:1.5;color:var(--ink)}
.fb[hidden]{display:none}
.fb.bad{--fc:var(--bad);background:var(--bad-tint)}
.fb.warn{--fc:var(--warn);background:var(--warn-tint)}
.fb .fi{width:2.1rem;height:2.1rem;border-radius:8px;display:grid;place-items:center;background:var(--fc);color:#fff}
.fb .why{display:block;color:var(--ink-2);margin-top:.2rem}

/* Result */
.result{display:grid;gap:.6rem;justify-items:center;text-align:center}
.result .res-art{width:min(300px,80%);border-radius:12px;overflow:hidden;background:var(--sky)}
.res-h{font-size:clamp(1.6rem,4vw,2rem);color:var(--ink)}
.res-score{font-size:1.4rem;font-weight:600;color:var(--ink)}

/* Grades: No conseguido, Conseguido, Bien, Notable, Sobresaliente */
.lv-0{--g:var(--g0);--gt:var(--g0t)}
.lv-1{--g:var(--g1);--gt:var(--g1t)}
.lv-2{--g:var(--g2);--gt:var(--g2t)}
.lv-3{--g:var(--g3);--gt:var(--g3t)}
.lv-4{--g:var(--g4);--gt:var(--g4t)}
.grade{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .6rem;border-radius:6px;background:var(--gt);color:var(--g);font-weight:700;font-size:.88rem;line-height:1.3;white-space:nowrap}
.grade .ic{width:1em;height:1em}
.grade.big{font-size:1.25rem;padding:.4rem .9rem;border-radius:10px;gap:.55rem}
.grade.big .ic{width:1.1em;height:1.1em}
.scale{list-style:none;margin:1.2rem 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;width:100%;max-width:640px}
.scale li{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.6rem .3rem;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--muted);font-weight:600;font-size:.84rem;text-align:center;line-height:1.2;border:1px solid var(--line);padding-inline:.2rem;hyphens:none}
.scale li .ic{width:1.2rem;height:1.2rem}
.scale li.on{background:var(--gt);color:var(--g);border-color:var(--g);font-weight:700}
.blk-h{font-size:1.1rem;width:100%;max-width:640px;margin:1.6rem 0 .3rem;text-align:left}
.blocks{list-style:none;margin:0;padding:0;width:100%;max-width:640px;display:grid;gap:.45rem}
.blk{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem .85rem;text-align:left}
.blk-name{flex:1 1 170px;font-weight:600;color:var(--ink)}
.segs2{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;flex:1 1 150px;min-width:110px}
.segs2 i{height:8px;border-radius:4px;background:var(--line)}
.segs2 i.ok{background:var(--ok)}
.blk-n{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.92rem}

/* Chart */
.legend{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.legend span{display:inline-flex;align-items:center;gap:.45rem;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:.2rem .75rem;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.legend i{width:20px;height:5px;border-radius:99px;background:var(--c)}
.legend i.dash{background:none;border-top:4px dashed var(--c);height:0}
.ctab{width:100%;border-collapse:collapse;margin-top:.9rem;font-size:.92rem;font-variant-numeric:tabular-nums;text-align:center}
.ctab th,.ctab td{padding:.4rem .25rem;border-bottom:1px solid var(--line)}
.ctab th{font-weight:700;color:var(--ink-2)}
.ctab th[scope=row]{text-align:left;white-space:nowrap}
.ctab th i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.4rem;vertical-align:-.1rem}
.chart .hit{fill:transparent;cursor:pointer}
.chart{width:100%;height:auto;display:block;max-height:360px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.chart .gl{stroke:var(--line);stroke-width:1.5}
.chart .ax{fill:var(--muted);font-size:19px;font-weight:600;font-family:var(--font)}
.chart .axt{fill:var(--ink-2);font-size:20px;font-weight:700;font-family:var(--font)}
.chart .pt{cursor:pointer;stroke:var(--surface);stroke-width:3}
.tip{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.6rem;margin:.7rem auto 0;max-width:480px;font-weight:600;font-size:1rem;border-radius:var(--radius-sm);padding:.45rem .8rem;background:var(--brand-tint);color:var(--ink)}
.tip .ic{color:var(--brand)}

/* Caminos que suman */
.sumline{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem}
.sumbig{font-weight:700;font-size:2rem;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sumbig span{font-size:1rem;color:var(--muted);font-weight:600}
.sum-msg{font-weight:600;font-size:.98rem;color:var(--ink-2);min-height:1.6em;text-align:right}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:500px;margin:1rem auto 0}
.cell{position:relative;aspect-ratio:1/1;min-width:0;padding:0;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:700;font-size:clamp(1.3rem,4.6vw,1.8rem);font-variant-numeric:tabular-nums}
.cell.in{background:var(--yellow-tint);border-color:var(--yellow)}
.cell.start{background:var(--brand);border-color:var(--brand);color:#fff}
.cell.end{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.next:not(:disabled){border:2px dashed var(--brand);color:var(--brand)}
.cell .tag{position:absolute;left:0;right:0;bottom:5px;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;line-height:1}

/* Granja */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem 1.25rem;box-shadow:var(--shadow)}
.panel-h{display:flex;gap:.7rem;align-items:center;margin-bottom:.9rem}
.panel-h .num{width:2rem;height:2rem;border-radius:8px;background:var(--c);color:var(--on,#fff);display:grid;place-items:center;font-weight:700;font-size:.95rem;flex:none}
.panel-h h2{font-size:1.2rem;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:640px){ .two{grid-template-columns:1fr} }
.stepper{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.round{width:3rem;height:3rem;border-radius:var(--radius-sm);border:1px solid var(--brand);background:var(--brand);color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:600}
.round:hover:not(:disabled){background:var(--brand-deep)}
.round:active:not(:disabled){transform:translateY(1px)}
.amount{min-width:5.2rem;text-align:center;font-weight:700;font-size:2rem;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amount small{font-size:1rem;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-weight:500;font-size:.95rem;margin-top:.7rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.6rem}
.tile{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:.75rem;align-items:center;width:100%;padding:.6rem .8rem;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);text-align:left;color:var(--ink)}
.tile:hover{border-color:var(--brand)}
.tile .ti{width:2.6rem;height:2.6rem;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);display:grid;place-items:center}
.tile .t-name{display:block;font-weight:600;font-size:1rem;line-height:1.25}
.tile .t-price{display:block;font-weight:500;font-size:.88rem;color:var(--muted)}
.tile .chk{width:1.9rem;height:1.9rem;border-radius:8px;border:1px solid var(--line-strong);display:grid;place-items:center;color:#fff}
.tile.on{border-color:var(--ok);background:var(--ok-tint)}
.tile.on .chk{background:var(--ok);border-color:var(--ok)}
.receipt{width:100%;border-collapse:collapse;font-size:.98rem;margin-top:.2rem}
.receipt td{padding:.55rem .1rem;border-bottom:1px dashed var(--line-strong);vertical-align:top}
.receipt td:last-child{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.receipt small{color:var(--muted);font-weight:500;font-size:.87rem}
.receipt tr.total td{border-bottom:none;padding-top:.9rem;font-size:1.2rem;font-weight:700;color:var(--brand)}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:.7rem;margin-top:1rem;padding:.85rem 1rem;border-radius:var(--radius-sm);border-left:4px solid var(--fc);background:var(--ok-tint);--fc:var(--ok);font-size:1rem;color:var(--ink)}
.verdict.bad{--fc:var(--bad);background:var(--bad-tint)}
.verdict .vi{width:2rem;height:2rem;border-radius:8px;background:var(--fc);color:#fff;display:grid;place-items:center}
.note{display:flex;gap:.6rem;align-items:center;margin-top:.8rem;font-weight:600;color:var(--warn)}
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:52px;font-weight:600;font-size:1.02rem;color:var(--ink)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3rem;color:var(--brand);line-height:1;width:1.8rem;height:1.8rem;border-radius:8px;background:var(--brand-tint);display:grid;place-items:center;flex:none;font-weight:600}
details[open] summary::after{content:"−"}
details p{padding:0 0 1rem;color:var(--ink-2)}

.bubble{cursor:pointer}
.ctx{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.9rem 1rem;margin-bottom:1.2rem}
.ctx .kicker{margin-bottom:.2rem}
.ctx-list{list-style:none;margin:.4rem 0 .7rem;padding:0}
.ctx-list li{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.98rem}
.ctx-list li:last-child{border-bottom:0}
.ctx-list b{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.fx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;min-height:132px;padding:1.2rem .8rem;text-align:center;font-weight:700;font-size:1.45rem;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fx .eq{color:var(--muted);font-weight:600;font-size:1.05rem}
.fx .cap{font-size:1rem;font-weight:600;color:var(--ink-2);letter-spacing:0}
.unit-final{display:grid;justify-items:center;gap:.5rem;margin-top:1.2rem;padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);width:100%;max-width:520px}
@media (max-width:640px){
  .top-school{display:none}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

function ico(name, cls = '') {

}

/* ---------- Activity art: short rule panels, never the answer ---------- */
const fx = html => `<div class="fx">${html}</div>`;
const SCENES = {
  prop: () => fx('<span>a + b</span><span class="eq">=</span><span>b + a</span>'),
  est: () => fx('<span>Redondea cada número</span><span class="cap">y después calcula</span>'),
  comb: () => fx('<span>Paréntesis primero</span><span class="cap">luego, de izquierda a derecha</span>'),
  prob: () => fx('<span>¿Qué dato falta?</span><span class="cap">Piensa antes de calcular</span>'),
  graf: () => fx('<span>Lee el punto</span><span class="eq">→</span><span>día y altura</span>'),
  cam: () => fx('<span>Llega a la meta</span><span class="eq">=</span><span>100</span>'),

};

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const BEST_KEY = 'mates4-u2-best';
const SIZE_KEY = 'mates4-u2-size';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = n => String(n).padStart(2, '0');
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const bestAll = () => store.get(BEST_KEY, {});

/* ---------- Text size ---------- */
let fontPx = clamp(store.get(SIZE_KEY, 19), 16, 26);
function setSize(px) {
  fontPx = clamp(px, 16, 26);
  document.documentElement.style.setProperty('--fs', fontPx + 'px');
  store.set(SIZE_KEY, fontPx);
}
setSize(fontPx);

const GRADES = [
  { min: 0, label: 'No conseguido' },
  { min: 50, label: 'Conseguido' },
  { min: 65, label: 'Bien' },
  { min: 75, label: 'Notable' },
  { min: 90, label: 'Sobresaliente' }
].map((g, k) => ({ ...g, key: k }));
const UNIT = ['prop', 'est', 'comb', 'prob', 'graf', 'cam', 'granja'];

function gradeOf(pct) {
  let g = GRADES[0];
  GRADES.forEach(x => { if (pct >= x.min) g = x; });
  return g;
}

function recordActivity(id, pct) {
  const best = bestAll();
  const prev = best[id];
  if (!prev || prev.pct == null || pct > prev.pct) {
    best[id] = { pct, lvl: gradeOf(pct).key };
    store.set(BEST_KEY, best);
  }
}

function unitStatus() {
  const best = bestAll();
  const scored = UNIT.filter(id => best[id] && best[id].pct != null);
  const complete = scored.length === UNIT.length;
  const avg = complete ? scored.reduce((s, id) => s + best[id].pct, 0) / UNIT.length : null;
  return { done: scored.length, complete, grade: complete ? gradeOf(avg) : null };
}

function gradePill(g, big = false) {
  return `<span class="grade lv-${g.key}${big ? ' big' : ''}">${g.label}</span>`;
}

function gradeScale(k) {
  return `<ol class="scale" aria-label="Escala de calificación">${GRADES.map(g => `<li class="lv-${g.key}${g.key === k ? ' on' : ''}">${g.label}</li>`).join('')}</ol>`;
}

/* ---------- Line chart data ---------- */
const CHART = {
  days: [0, 5, 10, 15, 20, 25],
  series: [
    { name: 'Aguacate', color: 'var(--s1)', vals: [0, 2, 8, 17, 32, 40], shape: 'circle', dash: false },
    { name: 'Tomatera', color: 'var(--s2)', vals: [0, 4, 11, 17, 26, 31], shape: 'square', dash: true }
  ]
};

function drawChart(el) {
  const W = 640, H = 380, PL = 64, PR = 24, PT = 22, PB = 56, maxY = 45;
  const X = d => PL + d / 25 * (W - PL - PR);
  const Y = v => H - PB - v / maxY * (H - PT - PB);
  let g = '';
  for (let v = 0; v <= maxY; v += 5) {
    g += `<line class="gl" x1="${PL}" x2="${W - PR}" y1="${Y(v)}" y2="${Y(v)}"/>`;
    if (v % 10 === 0) g += `<text class="ax" x="${PL - 12}" y="${Y(v) + 7}" text-anchor="end">${v}</text>`;
  }
  CHART.days.forEach(d => { g += `<text class="ax" x="${X(d)}" y="${H - PB + 28}" text-anchor="middle">${d}</text>`; });
  g += `<text class="axt" x="${(PL + W - PR) / 2}" y="${H - 8}" text-anchor="middle">Día</text>`;
  g += `<text class="axt" transform="translate(18 ${(PT + H - PB) / 2}) rotate(-90)" text-anchor="middle">Altura (cm)</text>`;
  CHART.series.forEach(se => {
    const pts = se.vals.map((v, i) => `${X(CHART.days[i])},${Y(v)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="${se.dash ? 4 : 5}"${se.dash ? ' stroke-dasharray="12 8"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  // Squares first (underneath), circles on top, so a point is visible even when two plants are at the same height
  const marks = [];
  CHART.series.forEach(se => se.vals.forEach((v, i) => marks.push({ se, v, d: CHART.days[i] })));
  marks.sort((a, b) => (a.se.shape === 'square' ? 0 : 1) - (b.se.shape === 'square' ? 0 : 1));
  marks.forEach(({ se, v, d }) => {
    const x = X(d), y = Y(v);
    const shape = se.shape === 'square'
      ? `<rect x="${x - 13}" y="${y - 13}" width="26" height="26" rx="5" fill="${se.color}" stroke="var(--surface)" stroke-width="3"/>`
      : `<circle cx="${x}" cy="${y}" r="8" fill="var(--surface)" stroke="${se.color}" stroke-width="5"/>`;
    g += `${shape}<circle class="hit" data-day="${d}" cx="${x}" cy="${y}" r="20"/>`;
  });
  const table = `<table class="ctab">
      <tr><th scope="row">Día</th>${CHART.days.map(d => `<td>${d}</td>`).join('')}</tr>
      ${CHART.series.map(se => `<tr><th scope="row"><i style="background:${se.color}"></i>${se.name}</th>${se.vals.map(v => `<td>${v} cm</td>`).join('')}</tr>`).join('')}
    </table>`;
  el.innerHTML = `
    <div class="legend">${CHART.series.map(s => `<span><i class="${s.dash ? 'dash' : ''}" style="--c:${s.color}"></i>${s.name}: ${s.shape === 'square' ? 'cuadrado y línea discontinua' : 'círculo y línea continua'}</span>`).join('')}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de líneas: altura del aguacate y de la tomatera según el día">${g}</svg>
    <div class="tip" id="tip"><span>Toca un día del gráfico para ver la altura de las dos plantas.</span></div>
    ${table}`;
  el.querySelectorAll('.hit').forEach(p => p.addEventListener('click', () => {
    const d = Number(p.dataset.day);
    const parts = CHART.series.map(se => `${se.name} ${se.vals[CHART.days.indexOf(d)]} cm`);
    const vs = CHART.series.map(se => se.vals[CHART.days.indexOf(d)]);
    const same = vs[0] === vs[1] ? ' Las dos están a la misma altura.' : '';
    el.querySelector('#tip span').textContent = `Día ${d}: ${parts.join(' · ')}.${same}`;
  }));
}

/* ---------- Layout pieces ---------- *//* ---------- Layout pieces ---------- *//* ---------- Layout pieces ---------- */
function cardHTML(a, i, best) {
  const b = best[a.id] || {};
  const status = b.lvl != null ? gradePill(GRADES[b.lvl]) : '<span class="muted">Pendiente</span>';
  const meta = a.items ? `${a.items.length} preguntas` : '1 tablero';
  return `
    <button class="card-act" style="--c:${a.c};--tint:${a.t}" data-go="${a.id}">
      <span class="art">${SCENES[a.id]()}</span>
      <span class="body">
        <span class="badge">${pad(i + 1)}</span>
        <span class="card-t">${a.title}</span>
        <span class="card-d">${a.desc}</span>
        <span class="card-f"><span>${meta}</span>${status}</span>
      </span>
    </button>`;
}

function progressSegs(n, i) {
  let s = '';
  for (let k = 0; k < n; k++) s += `<i class="${k < i ? 'on' : k === i ? 'cur' : ''}"></i>`;
  return `<div class="segs" style="--n:${n}" aria-hidden="true">${s}</div>`;
}

function shell(act, kicker, body) {
  return `
    <div class="quiz" style="--c:${act.c};--tint:${act.t};--on:${act.on || '#ffffff'}">
      <div class="crumb"><button class="btn" data-go="home">${ico('arrowLeft')}<span>Inicio</span></button></div>
      <section class="banner">
        <div>
          <p class="kicker">${kicker}</p>
          <h2>${act.title}</h2>
          <p class="desc">${act.desc}</p>
        </div>
        <div class="banner-art">${SCENES[act.id]()}</div>
      </section>
      ${body}
    </div>`;
}

/* ---------- Quiz engine ---------- */
let S = { st: {}, kb: false, buf: '', i: 0, items: [], good: 0 };

function startQuiz(act, items, key, title) {
  S = { act, key, title, items, i: 0, good: 0, res: [], st: {}, kb: false, buf: '' };
  renderQ();
}

function renderQ() {
  const it = S.items[S.i], n = S.items.length;
  S.st = { attempts: 0, done: false };
  S.kb = it.type === 'input';
  S.buf = '';
  const kicker = `Actividad ${pad(ACTS.findIndex(a => a.id === S.key) + 1)}`;
  $('#app').innerHTML = shell(S.act, kicker, `
    ${progressSegs(n, S.i)}
    <section class="sheet">
      <div class="sheet-top">
        <span class="pill-s">Pregunta ${S.i + 1} de ${n}</span>
      </div>
      ${S.act.context || ''}
      <div id="visual"></div>
      <h3 class="q">${it.q}</h3>
      <div id="ans"></div>
      <div id="fb" class="fb" hidden></div>
      <div class="actions"><span></span><button class="btn primary" id="nextBtn" disabled><span>Siguiente</span>${ico('arrowRight')}</button></div>
    </section>`);
  if (it.visual) it.visual($('#visual'));
  if (it.type === 'choice') renderChoices(it); else renderKeypad(it);
  $('#nextBtn').onclick = nextQ;
  window.scrollTo({ top: 0 });
}

function renderChoices(it) {
  if (!it._o) it._o = shuffle(it.options.map((t, k) => ({ t, ok: k === it.a })));
  const wrap = document.createElement('div');
  wrap.className = 'opts';
  it._o.forEach((o, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABC'[idx]}</span><span>${o.t}</span>`;
    b._o = o;
    b.onclick = () => pickChoice(b, o, it);
    wrap.appendChild(b);
  });
  $('#ans').appendChild(wrap);
}

function pickChoice(btn, o, it) {
  if (S.st.done) return;
  if (o.ok) { btn.classList.add('right'); return finish(true, it, ''); }
  S.st.attempts++;
  btn.classList.add('wrong', 'shake');
  btn.disabled = true;
  if (S.st.attempts >= 2) {
    const right = [...document.querySelectorAll('#ans .opt')].find(b => b._o.ok);
    right.classList.add('right');
    return finish(false, it, right.querySelector('span:last-child').textContent);
  }
  showFb('warn', '<b>Casi.</b> Piénsalo otra vez.', 'Tienes otra oportunidad.', 'info');
}

function renderKeypad(it) {
  $('#ans').innerHTML = `
    <div class="answer" id="entry"><span id="disp"></span>${it.unit ? `<span class="unit">${it.unit}</span>` : ''}</div>
    <div class="keypad">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="key" data-k="${d}" aria-label="${d}">${d}</button>`).join('')}
      <button class="key fn" data-k="back" aria-label="Borrar">${ico('delete')}</button>
      <button class="key" data-k="0" aria-label="0">0</button>
      <button class="key ok" data-k="ok" aria-label="Comprobar">${ico('check')}</button>
    </div>`;
  updateDisp();
}

function updateDisp() {
  const d = document.getElementById('disp');
  if (!d) return;
  d.innerHTML = S.buf === '' ? '<span class="ph">–</span>' : fmt(parseInt(S.buf, 10));
}

function pressKey(k) {
  if (!S.kb || S.st.done || !document.getElementById('ans')) return;
  const it = S.items[S.i];
  if (k === 'back') {
    S.buf = S.buf.slice(0, -1);
  } else if (k === 'ok') {
    if (S.buf === '') return;
    const v = parseInt(S.buf, 10);
    if (v === it.a) return finish(true, it, '');
    S.st.attempts++;
    S.buf = '';
    updateDisp();
    if (S.st.attempts >= 2) return finish(false, it, fmt(it.a) + (it.unit ? ' ' + it.unit : ''));
    const e = document.getElementById('entry');
    e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake');
    showFb('warn', '<b>Casi.</b> Revisa los cálculos paso a paso.', 'Tienes otra oportunidad.', 'info');
    return;
  } else if (/^\d$/.test(k) && S.buf.length < 7) {
    S.buf += k;
  }
  updateDisp();
}

function showFb(cls, title, sub, icon) {
  const fb = document.getElementById('fb');
  if (!fb) return;
  fb.hidden = false;
  fb.className = 'fb ' + cls;
  fb.innerHTML = `<span class="fi">${ico(icon || (cls === 'bad' ? 'x' : 'check'))}</span><div>${title}${sub ? `<span class="why">${sub}</span>` : ''}</div>`;
}

function finish(ok, it, shown) {
  S.st.done = true;
  S.kb = false;
  const first = ok && S.st.attempts === 0;
  if (first) S.good++;
  S.res[S.i] = first;
  if (first) showFb('ok', '<b>¡Muy bien!</b>', it.why, 'check');
  else if (ok) showFb('ok', '<b>Lo has conseguido.</b>', it.why, 'check');
  else showFb('bad', `La respuesta correcta es <b>${shown}</b>.`, it.why, 'x');
  document.querySelectorAll('#ans button').forEach(b => { b.disabled = true; });
  const nb = $('#nextBtn');
  nb.disabled = false;
  nb.innerHTML = S.i === S.items.length - 1 ? `<span>Ver resultado</span>${ico('flag')}` : `<span>Siguiente</span>${ico('arrowRight')}`;
}

function nextQ() {
  S.i++;
  if (S.i >= S.items.length) return renderEnd();
  renderQ();
}

/* ---------- Result of an activity (grade only, no counts) ---------- */
function showResult(pct) {
  recordActivity(S.key, pct);
  const g = gradeOf(pct);
  const st = unitStatus();
  const msgs = [
    'Repasa lo que ha fallado y vuelve a intentarlo.',
    'Vas por buen camino. Repasa lo que ha fallado.',
    'Buen trabajo. Repasa los detalles que han fallado.',
    'Muy buen trabajo. Casi lo tienes dominado.',
    '¡Excelente! Dominas este contenido.'
  ];
  const unitBlock = summaryHTML();
  $('#app').innerHTML = shell(S.act, 'Calificación', `
    <section class="sheet result">
      ${gradePill(g, true)}
      <p class="ink2">${msgs[g.key]}</p>
      ${gradeScale(g.key)}
      ${unitBlock}
      <div class="actions center" style="gap:.8rem">
        <button class="btn" data-go="${S.key}">${ico('refresh')}<span>Repetir</span></button>
        <button class="btn primary" data-go="home"><span>Volver al inicio</span>${ico('arrowRight')}</button>
      </div>
    </section>`);
  window.scrollTo({ top: 0 });
}

function renderEnd() {
  showResult(Math.round(S.good / S.items.length * 100));
}

/* ---------- Unit summary: each activity's grade and the global grade ---------- */
function summaryHTML() {
  const best = bestAll();
  const st = unitStatus();
  const rows = ACTS.filter(a => UNIT.includes(a.id)).map((a, i) => {
    const b = best[a.id] || {};
    const pill = b.lvl != null ? gradePill(GRADES[b.lvl]) : '<span class="muted">Pendiente</span>';
    return `<li class="blk"><span class="blk-name">${pad(i + 1)} · ${a.title}</span>${pill}</li>`;
  }).join('');
  const head = st.complete
    ? `<div class="unit-final"><p class="kicker">Nota global de la unidad</p>${gradePill(st.grade, true)}<p class="ink2">Media de las ${UNIT.length} actividades.</p></div>`
    : `<div class="unit-final"><p class="kicker">Nota global de la unidad</p><p class="ink2">Pendiente: faltan ${UNIT.length - st.done} de ${UNIT.length} actividades.</p></div>`;
  return `${head}<h3 class="blk-h">Nota de cada actividad</h3><ul class="blocks">${rows}</ul>`;
}

function renderUnit() {
  S.kb = false;
  $('#app').innerHTML = `

        <div class="sumbig" id="sumBig"></div>
        <div class="sum-msg" id="sumMsg"></div>
      </div>
      <div class="board" id="board"></div>
      <div class="actions">
        <button class="btn" data-cam="undo">${ico('undo')}<span>Deshacer</span></button>
      </div>
    </section>`;
  $('#app').innerHTML = shell(S.act, 'Actividad 06', body);
  paintCaminos();
}

function paintCaminos() {
  const board = document.getElementById('board');
  if (!board) return;
  const N = CAMINOS.length, g = CAMINOS;
  const sum = CAM.path.reduce((a, [r, c]) => a + g[r][c], 0);
  const last = CAM.path[CAM.path.length - 1];
  const end = last[0] === N - 1 && last[1] === N - 1;
  if (end && sum === 100) { showResult(100); return; }
  const inPath = (r, c) => CAM.path.some(([a, b]) => a === r && b === c);
  const nexts = end ? [] : [[last[0] - 1, last[1]], [last[0] + 1, last[1]], [last[0], last[1] - 1], [last[0], last[1] + 1]]
    .filter(([r, c]) => r >= 0 && c >= 0 && r < N && c < N && !inPath(r, c));
  const isNext = (r, c) => nexts.some(([a, b]) => a === r && b === c);
  let cells = '';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const nx = isNext(r, c);
      const isStart = r === 0 && c === 0, isEnd = r === N - 1 && c === N - 1;
      const cls = ['cell', inPath(r, c) ? 'in' : '', isStart ? 'start' : '', isEnd ? 'end' : '', nx ? 'next' : ''].join(' ');
      const tag = isStart ? '<span class="tag">Inicio</span>' : isEnd ? '<span class="tag">Meta</span>' : '';
      cells += `<button class="${cls}" data-cell="${r},${c}" ${nx ? '' : 'disabled'} aria-label="Casilla ${g[r][c]}">${g[r][c]}${tag}</button>`;
    }
  }
  board.innerHTML = cells;
  document.getElementById('sumBig').innerHTML = `${sum} <span>/ 100</span>`;
  let msg;
  if (end) msg = sum < 100 ? `Has llegado a la meta, pero te faltan ${100 - sum}. Deshaz algún paso.` : 'Te has pasado de 100. Deshaz algún paso.';
  else if (sum > 100) msg = 'Vas por encima de 100. Deshaz algún paso.';
  else msg = 'Sigue avanzando.';
  document.getElementById('sumMsg').innerHTML = msg;
}

/* ---------- Navigation and input (one delegated listener) ---------- */
function go(key) {
  S.kb = false;
  if (key === 'home') return renderHome();
  if (key === 'unit') return renderUnit();
  const act = ACTS.find(a => a.id === key);
  if (!act) return renderHome();
  if (act.special === 'caminos') return renderCaminos();
  startQuiz(act, shuffle(act.items.map(it => ({ ...it, blk: act.id }))), act.id, act.title);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-k],[data-cell],[data-cam],[data-size]');
  if (!el) return;
  const d = el.dataset;
  if (d.go) return go(d.go);
  if (d.k) return pressKey(d.k);
  if (d.size) return setSize(fontPx + Number(d.size));
  if (d.cell) { const [r, c] = d.cell.split(',').map(Number); CAM.path.push([r, c]); return paintCaminos(); }
  if (d.cam === 'undo') { if (CAM.path.length > 1) CAM.path.pop(); return paintCaminos(); }
});

document.addEventListener('keydown', e => {
  if (!S.kb) return;
  if (/^\d$/.test(e.key)) pressKey(e.key);
  else if (e.key === 'Backspace') { e.preventDefault(); pressKey('back'); }
  else if (e.key === 'Enter') pressKey('ok');
});

renderHome();
</script>
